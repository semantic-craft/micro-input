name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run scripts/check (Rust, Swift, formal BFS models, boundaries, comments, Python lint)
        env:
          RUST_TEST_THREADS: "2"
        run: ./scripts/check

      - name: Run scripts/verify-offline (6 isolated synthetic E2E scenarios)
        run: ./scripts/verify-offline --qa-only
