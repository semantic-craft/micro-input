[workspace]
members = ["crates/*"]
resolver = "2"
[workspace.package]
version = "0.2.0"
edition = "2021"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }
