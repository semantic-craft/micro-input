[package]
name = "mi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[features]
qa-runner = ["dep:mi-bridge", "mi-bridge/qa-runner", "mi-macos/qa-runner"]

[dependencies]
mi-bridge = { path = "../mi-bridge", optional = true }
mi-macos = { path = "../mi-macos" }
mi-model = { path = "../mi-model" }
mi-proto = { path = "../mi-proto" }
mi-session = { path = "../mi-session" }
mi-transport = { path = "../mi-transport" }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
mi-macos = { path = "../mi-macos", features = ["test-util"] }
tempfile = "3"
