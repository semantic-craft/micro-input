[package]
name = "mi-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[features]
test-util = []
qa-runner = [
    "test-util",
    "dep:mi-proto",
    "dep:mi-session",
    "dep:mi-transport",
    "dep:tokio",
    "mi-session/synthetic-backend",
    "mi-transport/synthetic-backend",
]

[dependencies]
libc = "0.2"
mi-model = { path = "../mi-model" }
mi-proto = { path = "../mi-proto", optional = true }
mi-session = { path = "../mi-session", optional = true }
mi-transport = { path = "../mi-transport", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
